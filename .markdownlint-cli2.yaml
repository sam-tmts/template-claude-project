# Markdown lint settings, used locally and in CI
config:
  # Long table rows and URLs make a hard line-length limit more noise than help
  MD013: false
  # Templates (PR template, issue bodies) don't start with a top-level heading
  MD041: false
  # Keep a Changelog repeats "Added", "Changed" and so on under each version
  MD024:
    siblings_only: true
  # Templates use <placeholder> text, which the linter mistakes for HTML
  MD033: false
  # Table pipe alignment is cosmetic and fights with hand-edited tables
  MD060: false
  # CR plans number their steps continuously across phases so steps can be cited
  MD029: false
