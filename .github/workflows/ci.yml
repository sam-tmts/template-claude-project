# Language-neutral checks for every pull request and every push to main. Projects add
# their own build and test jobs in their first CR. Protected path: changes need a CR.
#
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment) so a
# moved or hijacked tag can't change what runs. Dependabot proposes updates.
name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

# Read-only token unless a job asks for more
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan the history being merged
        # Only history reachable from the checked-out commit: on a pull request that is
        # main plus the PR's commits. Without this, gitleaks scans every branch, so a
        # secret on any other branch would fail every pull request.
        run: gitleaks git --redact --no-banner --verbose --log-opts="HEAD" .

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  cr0000-ac4-actions-pinned:
    name: Actions pinned and token read-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every workflow
        run: bash .github/scripts/check-actions-pinned.sh

  cr-link:
    name: PR references a CR
    # Dependabot's routine dependency updates are exempt (see README)
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the PR says which existing CR it implements
        # The PR body is untrusted text: pass it in an environment variable, never
        # straight into the script, so it can't inject shell commands.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/check-cr-reference.sh
